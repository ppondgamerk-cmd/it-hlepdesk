<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - IT Helpdesk</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container" style="justify-content: center; min-height: 100vh;">
        <main style="display: flex; align-items: center; justify-content: center; flex-grow: 1;">
            <section id="login-view" class="view-section active" style="width: 100%;">
                <div class="login-container">
                    <div class="login-header">
                        <i class="fa-solid fa-laptop-medical"></i>
                        <h2>ระบบแจ้งซ่อมไอที</h2>
                        <p>IT Helpdesk Repair Request System</p>
                    </div>

                    <form id="auth-login-form">
                        <div class="form-group" style="text-align: left; margin-bottom: 18px;">
                            <label for="login-username">ชื่อผู้ใช้งาน (Username) <span style="color:#ef4444;">*</span></label>
                            <input type="text" id="login-username" class="form-control" placeholder="ระบุชื่อผู้ใช้ (เช่น user1 หรือ admin)" required>
                        </div>

                        <div class="form-group" style="text-align: left; margin-bottom: 25px;">
                            <label for="login-password">รหัสผ่าน (Password) <span style="color:#ef4444;">*</span></label>
                            <input type="password" id="login-password" class="form-control" placeholder="ระบุรหัสผ่าน" required>
                        </div>

                        <button type="submit" class="btn-submit">
                            <i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ
                        </button>
                    </form>

                    <div style="margin-top: 25px; padding: 12px; background: rgba(255,255,255,0.03); border: 1px dashed var(--bg-card-border); border-radius: 8px; font-size: 0.8rem; text-align: left;">
                        <div style="font-weight: 600; color: #a5b4fc; margin-bottom: 6px;"><i class="fa-solid fa-circle-info"></i> บัญชีผู้ใช้สำหรับการทดสอบ:</div>
                        <div style="color: var(--text-muted); margin-bottom: 4px;">• <strong>พนักงานทั่วไป:</strong> <code>user1</code> (รหัสผ่าน: <code>userpassword</code>)</div>
                        <div style="color: var(--text-muted);">• <strong>เจ้าหน้าที่ IT:</strong> <code>admin</code> (รหัสผ่าน: <code>password123</code>)</div>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
