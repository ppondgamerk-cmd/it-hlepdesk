<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แจ้งปัญหา IT - IT Helpdesk</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Shared Header -->
        <header id="main-header">
            <div class="logo">
                <i class="fa-solid fa-headset"></i>
                <span>IT HELPDESK</span>
            </div>
            
            <nav class="nav-links">
                <a href="report.html" class="nav-item user-only"><i class="fa-solid fa-pen-to-square"></i> แจ้งปัญหา</a>
                <a href="tickets.html" class="nav-item user-only"><i class="fa-solid fa-list-check"></i> รายการของคุณ</a>
                <a href="dashboard.html" class="nav-item staff-only"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
                <a href="tickets.html" class="nav-item staff-only"><i class="fa-solid fa-ticket"></i> รายการ Ticket</a>
                <a href="history.html" class="nav-item staff-only"><i class="fa-solid fa-book-open"></i> คลังความรู้ (Knowledge Base)</a>
            </nav>

            <div class="user-profile">
                <span id="profile-role" class="role-badge">Role</span>
                <span id="profile-name" style="font-weight: 500; font-size: 0.95rem;">Username</span>
                <button class="logout-btn" onclick="logout()">
                    <i class="fa-solid fa-right-from-bracket"></i> ออกจากระบบ
                </button>
            </div>
        </header>

        <main style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center;">
            <section id="report-view" class="view-section active">
                <div class="workspace-grid" style="grid-template-columns: 1fr;">
                    <div class="panel-card" style="max-width: 700px; margin: 0 auto; width: 100%;">
                        <h3 class="panel-title"><i class="fa-solid fa-circle-plus"></i> แจ้งปัญหาการใช้งาน IT</h3>
                        
                        <form id="report-form">
                            <div class="form-group">
                                <label for="issue-title">หัวข้อปัญหา / อาการเบื้องต้น <span style="color:#ef4444;">*</span></label>
                                <input type="text" id="issue-title" class="form-control" placeholder="เช่น คอมพิวเตอร์เปิดไม่ติด, ปริ้นเตอร์ไม่ทำงาน, เชื่อม Wi-Fi ไม่ได้" required>
                            </div>

                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                                <div class="form-group">
                                    <label for="reporter-name">ชื่อผู้แจ้ง <span style="color:#ef4444;">*</span></label>
                                    <input type="text" id="reporter-name" class="form-control" required>
                                </div>
                                <div class="form-group">
                                    <label for="reporter-dept">แผนก <span style="color:#ef4444;">*</span></label>
                                    <input type="text" id="reporter-dept" class="form-control" placeholder="เช่น การเงิน, บุคคล, ไอที" required>
                                </div>
                            </div>

                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                                <div class="form-group">
                                    <label for="equip-code">อุปกรณ์ / รหัสเครื่องที่เกิดปัญหา</label>
                                    <input type="text" id="equip-code" class="form-control" placeholder="เช่น Notebook-IT-01, Printer-MKT">
                                </div>
                                <div class="form-group">
                                    <label for="issue-urgency">ระดับความเร่งด่วน <span style="color:#ef4444;">*</span></label>
                                    <select id="issue-urgency" class="form-control" required>
                                        <option value="ต่ำ">ต่ำ (Low) - SLA 24 ชั่วโมง</option>
                                        <option value="กลาง" selected>กลาง (Medium) - SLA 8 ชั่วโมง</option>
                                        <option value="สูง">สูง (High) - SLA 2 ชั่วโมง</option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="issue-details">รายละเอียดข้อผิดพลาดเพิ่มเติม <span style="color:#ef4444;">*</span></label>
                                <textarea id="issue-details" class="form-control" placeholder="บอกลักษณะอาการอย่างละเอียด หรือขั้นตอนก่อนที่จะเกิดปัญหา..." required></textarea>
                            </div>

                            <div class="form-group">
                                <label for="issue-image">แนบรูปภาพหน้าจอ หรือภาพความเสียหายประกอบ (ขนาดไม่เกิน 2MB)</label>
                                <input type="file" id="issue-image" class="form-control" accept="image/*" style="padding: 8px 12px; cursor: pointer;">
                            </div>

                            <button type="submit" class="btn-submit">
                                <i class="fa-solid fa-paper-plane"></i> ส่งรายงานคำขอซ่อม
                            </button>
                        </form>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
