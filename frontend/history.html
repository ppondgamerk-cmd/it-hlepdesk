<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คลังความรู้ (Knowledge Base) - IT Helpdesk</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Shared Header -->
        <header id="main-header">
            <div class="logo">
                <i class="fa-solid fa-headset"></i>
                <span>IT HELPDESK</span>
            </div>
            
            <nav class="nav-links">
                <a href="report.html" class="nav-item user-only"><i class="fa-solid fa-pen-to-square"></i> แจ้งปัญหา</a>
                <a href="tickets.html" class="nav-item user-only"><i class="fa-solid fa-list-check"></i> รายการของคุณ</a>
                <a href="dashboard.html" class="nav-item staff-only"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
                <a href="tickets.html" class="nav-item staff-only"><i class="fa-solid fa-ticket"></i> รายการ Ticket</a>
                <a href="history.html" class="nav-item staff-only"><i class="fa-solid fa-book-open"></i> คลังความรู้ (Knowledge Base)</a>
            </nav>

            <div class="user-profile">
                <span id="profile-role" class="role-badge">Role</span>
                <span id="profile-name" style="font-weight: 500; font-size: 0.95rem;">Username</span>
                <button class="logout-btn" onclick="logout()">
                    <i class="fa-solid fa-right-from-bracket"></i> ออกจากระบบ
                </button>
            </div>
        </header>

        <main style="flex-grow: 1; display: flex; flex-direction: column;">
            <section id="history-view" class="view-section active">
                <div class="panel-card" style="max-width: 850px; margin: 0 auto; width:100%;">
                    <h3 class="panel-title"><i class="fa-solid fa-book-open"></i> คลังความรู้และการแก้ปัญหาย้อนหลัง (Knowledge Base)</h3>
                    <div id="history-list-container" class="history-list">
                        <!-- Loaded dynamically via app.js -->
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
