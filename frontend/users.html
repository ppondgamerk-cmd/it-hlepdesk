<!DOCTYPE html>
<html lang="th">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>จัดการผู้ใช้ · IT Helpdesk</title><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></head>
<body>
<div class="app-container">
<header id="main-header"><div class="logo"><i class="fa-solid fa-headset"></i><span>IT HELPDESK</span></div><nav class="nav-links"><a href="dashboard.html" class="nav-item staff-only">ภาพรวม</a><a href="tickets.html" class="nav-item staff-only">รายการแจ้งซ่อม</a><a href="history.html" class="nav-item staff-only">ประวัติการแก้ไข</a></nav><div class="user-profile"><span id="profile-role" class="role-badge"></span><span id="profile-name"></span><button class="logout-btn" onclick="logout()">ออกจากระบบ</button></div></header>
<main><div class="page-heading"><div><div class="eyebrow">ADMINISTRATION</div><h1>ทีมและสิทธิ์การใช้งาน</h1><p>สร้างบัญชี กำหนดบทบาท และควบคุมการเข้าถึงระบบ</p></div></div>
<div class="admin-grid">
<section class="panel-card"><h2 class="panel-title">เพิ่มสมาชิก</h2><form id="create-user-form" onsubmit="event.preventDefault();runBusy(this, createUser)"><div class="form-group"><label for="new-name">ชื่อแสดงผล</label><input id="new-name" class="form-control" maxlength="100" required></div><div class="form-group"><label for="new-username">ชื่อผู้ใช้</label><input id="new-username" class="form-control" pattern="[a-zA-Z0-9_.\-]{3,40}" minlength="3" maxlength="40" autocomplete="off" placeholder="ตัวอักษรอังกฤษ ตัวเลข . _ -" required></div><div class="form-group"><label for="new-password">รหัสผ่านเริ่มต้น</label><input type="password" id="new-password" class="form-control" minlength="10" maxlength="128" autocomplete="new-password" placeholder="อย่างน้อย 10 ตัวอักษร" required></div><div class="form-group"><label for="new-role">บทบาท</label><select id="new-role" class="form-control"><option value="user">ผู้แจ้งซ่อม — งานของตัวเอง</option><option value="staff">เจ้าหน้าที่ IT — ดูแลทุกงาน</option><option value="admin">ผู้ดูแลระบบ — จัดการบัญชีด้วย</option></select></div><button class="btn-submit" type="submit">สร้างบัญชี</button></form></section>
<section class="panel-card"><h2 class="panel-title">สมาชิกในระบบ <span id="user-count" class="role-badge"></span></h2><p class="muted">การแก้ไขสิทธิ์หรือรหัสผ่านจะให้บัญชีนั้นเข้าสู่ระบบใหม่</p><div id="users-list" class="member-list"></div></section>
</div></main></div><script src="js/app.js"></script></body></html>
